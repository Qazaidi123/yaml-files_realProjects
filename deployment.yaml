apiVersion: apps/v1
kind: Deployment

metadata:
     name: backend-deployment
     labels:
        app: backend

spec:
    replicas: 3
    revisionHistoryLimit: 10

    strategy:
       type: RollingUpdate
       rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1

    selector:
       matchLabels:
           app: backend

    
    template:
       metadata:
            labels:
               app: backend

       spec:
           containers:
               - name: backend-container
                 image: myrepo/backend:v1.0.0
                 imagePullPolicy: IfNotPresent

                 ports:
                     - containerPort: 8080

                 envFrom:
                     - configMapRef:
                           name: backend-configmap
                     - secretRef:
                           name: backend-secret

                 resources:
                     requests:
                         cpu: "250m"
                         memory: "256Mi"
                     limits:
                        cpu: "500m"
                        memory: "512Mi"

                 startupProbe:
                         httpGet:
                             path: /startup
                             port: 8080
                         periodSeconds: 10
                         failureThreshold: 30

                 livenessProbe:
                        httpGet:
                            path: /health
                            port: 8080
                        initialDelaySeconds: 10
                        periodSeconds: 20
                        failureThreshold: 3

                 readinessProbe:
                        httpGet:
                            path: /health
                            port: 8080
                        initialDelaySeconds: 30
                        periodSeconds: 10
                        failureThreshold: 3

                 securityContext:
                        allowPrivilegeEscalation: false
                        runAsNonRoot: true
                        runAsUser: 1000
                        readOnlyRootFilesystem: false

          terminationGracePeriodSeconds: 30

